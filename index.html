<!DOCTYPE html>
<html>
<head>
<title>Profile Card Activity</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. NAVBAR -->
<div class="navbar">
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Profile</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- 2. CARD CONTAINER -->
<div class="card-container">

  <!-- 3. PROFILE CARD -->
  <div class="profile-card">

    <!-- 4. BADGE -->
    <div class="badge">PRO</div>

    <!-- 5. PROFILE IMAGE -->
    <div class="profile-image">
      <img src="akkarawin.jpg" alt="Profile">
    </div>

    <!-- 6. NAME & TITLE -->
    <h2 class="name">Akkarawin Poonyasawat</h2>
    <p class="title">Web Developer</p>

    <!-- 7. SOCIAL ICONS -->
    <div class="social-icons">
      <span class="icon">📘</span>
      <span class="icon">🐦</span>
      <span class="icon">📸</span>
    </div>

    <!-- 8. FOLLOW BUTTON -->
    <button class="follow-btn">Follow</button>

  </div>

  <!-- 9. STICKY SECTION HEADER -->
  <div class="section-header">About</div>

  <!-- 10. CONTENT -->
  <div class="content">
    <p>This is a simple profile card example using CSS positioning and display properties.</p>
    <p>Scroll to see sticky effects in action.</p>
  </div>

</div>

</body>
</html>
